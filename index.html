<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plate Reader Map — cameras, conflict and disasters</title>
<meta name="description" content="A map of community-reported ALPR camera locations, active armed conflicts, and current natural disasters worldwide — built from OpenStreetMap, UCDP, USGS, NASA and GDACS data.">

<meta property="og:title" content="Plate Reader Map">
<meta property="og:description" content="ALPR cameras, armed conflict and natural disasters on one map.">
<meta property="og:type" content="website">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">

<style>
:root{
  --ink:#141A22;
  --ink-soft:#5A6675;
  --steel:#E7EAEE;
  --paper:#F7F8F9;
  --line:#C9D0D8;
  --hazard:#D4A017;
  --danger:#8C3A2E;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

#map{position:absolute;inset:0;background:var(--steel)}

/* ---------- top bar ---------- */
.bar{
  position:absolute;top:0;left:0;right:0;z-index:600;
  padding:10px 12px 12px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:linear-gradient(to bottom,rgba(247,248,249,.97) 72%,rgba(247,248,249,0));
  pointer-events:none;
}
.bar > *{pointer-events:auto}

.brand{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px}
.brand h1{font-size:17px;font-weight:650;letter-spacing:-.015em;margin:0}
.brand span{font-size:12.5px;color:var(--ink-soft)}

.searchrow{display:flex;gap:8px;max-width:860px}
.field{
  flex:1;position:relative;display:flex;align-items:center;
  background:#fff;border:1px solid var(--line);border-radius:9px;
  box-shadow:0 1px 2px rgba(20,26,34,.06);
}
.field input{
  flex:1;border:0;background:none;outline:none;
  font:inherit;font-size:15px;padding:11px 12px;color:var(--ink);
  min-width:0;
}
.field input::placeholder{color:#98A2AE}
.iconbtn{
  border:0;background:none;padding:0 12px;align-self:stretch;
  color:var(--ink-soft);cursor:pointer;font-size:15px;
}
.iconbtn:hover{color:var(--ink)}

button.solid,button.ghost{
  font:inherit;font-size:14px;font-weight:550;
  padding:0 14px;border-radius:9px;cursor:pointer;white-space:nowrap;
}
button.solid{border:1px solid var(--ink);background:var(--ink);color:#fff}
button.solid:hover{background:#0B1017}
button.solid:disabled{opacity:.45;cursor:default}
button.ghost{
  border:1px solid var(--line);background:#fff;color:var(--ink);
  display:inline-flex;align-items:center;gap:7px;
}
button.ghost:hover{border-color:var(--ink-soft)}
button.ghost .count{
  font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:650;
  background:var(--ink);color:#fff;border-radius:999px;
  min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;
}

:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}

/* ---------- layer panel ---------- */
.panel{
  position:absolute;z-index:620;
  top:calc(104px + env(safe-area-inset-top,0px));right:12px;width:332px;
  max-height:calc(100% - 132px - env(safe-area-inset-top,0px));
  display:flex;flex-direction:column;
  background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 30px rgba(20,26,34,.18);
}
.panel[hidden]{display:none}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 8px 11px 14px;border-bottom:1px solid var(--steel);flex:none;
}
.panel-head h2{font-size:13.5px;font-weight:650;margin:0;letter-spacing:.01em}
.panel-body{overflow-y:auto;padding:4px 0 6px;overscroll-behavior:contain}

.layer{padding:12px 14px;border-bottom:1px solid var(--steel)}
.layer:last-child{border-bottom:0}

/* switch */
.switch{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{
  flex:none;width:34px;height:20px;border-radius:999px;margin-top:1px;
  background:var(--line);position:relative;transition:background .15s ease;
}
.switch .track::after{
  content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;
  border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);
  transition:transform .15s ease;
}
.switch input:checked + .track{background:var(--accent,var(--ink))}
.switch input:checked + .track::after{transform:translateX(14px)}
.switch input:focus-visible + .track{outline:2px solid var(--hazard);outline-offset:2px}
.switch-text{display:block;min-width:0}
.switch-title{display:block;font-size:14px;font-weight:600;line-height:1.3}
.switch-sub{display:block;font-size:11.5px;color:var(--ink-soft);line-height:1.35;margin-top:1px}

.layer-body{margin:12px 0 0 44px}
.layer-note{
  font-size:11.5px;color:var(--ink-soft);line-height:1.45;
  margin:10px 0 0 44px;
}
.layer-note.err{color:var(--danger)}
.layer-note a{color:var(--ink-soft)}
.fgroup + .fgroup{margin-top:11px}
.fgroup-title{
  font-size:10.5px;font-weight:650;text-transform:uppercase;
  letter-spacing:.06em;color:var(--ink-soft);margin:0 0 6px;
}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:#fff;color:var(--ink-soft);
  font:inherit;font-size:12px;font-weight:500;
  padding:5px 9px;border-radius:999px;cursor:pointer;white-space:nowrap;
  max-width:100%;
}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="false"]{opacity:.45}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip .n{font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.chip .note{font-size:10.5px;color:var(--ink-soft);font-style:italic}

/* segmented control */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{
  font:inherit;font-size:12px;font-weight:500;border:0;
  background:#fff;color:var(--ink-soft);padding:6px 10px;cursor:pointer;
  border-right:1px solid var(--line);
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ---------- status ---------- */
.status{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:610;
  background:var(--ink);color:#fff;border-radius:999px;
  font-size:13px;padding:9px 16px;
  box-shadow:0 4px 14px rgba(20,26,34,.25);
  max-width:calc(100% - 32px);text-align:center;
}
.status.err{background:var(--danger)}
.status[hidden]{display:none}

/* ---------- search results ---------- */
.hits{
  position:absolute;left:12px;right:12px;max-width:836px;z-index:650;
  background:#fff;border:1px solid var(--line);border-radius:9px;
  box-shadow:0 8px 24px rgba(20,26,34,.16);
  overflow:hidden;max-height:50vh;overflow-y:auto;
}
.hits[hidden]{display:none}
.hits button{
  display:block;width:100%;text-align:left;border:0;background:none;
  font:inherit;font-size:14px;padding:10px 13px;cursor:pointer;
  border-bottom:1px solid var(--steel);color:var(--ink);
}
.hits button:last-child{border-bottom:0}
.hits button:hover,.hits button:focus{background:var(--paper);outline:none}
.hits .sub{display:block;font-size:12px;color:var(--ink-soft);margin-top:1px}

/* ---------- popup ---------- */
.maplibregl-popup-content{
  border-radius:10px;padding:12px 14px;
  font-size:13.5px;line-height:1.45;
  box-shadow:0 6px 20px rgba(20,26,34,.2);
}
.pop-title{font-weight:650;font-size:14.5px;margin:0 0 4px;display:flex;align-items:flex-start;gap:7px}
.pop-title .dot{margin-top:5px}
.pop-tag{
  font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-soft);margin:0 0 7px;
}
.pop-lede{margin:0 0 8px;font-size:12.5px;color:var(--ink);line-height:1.4}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0}
.pop dt{color:var(--ink-soft);white-space:nowrap}
.pop dd{margin:0}
.pop-warn{
  margin:8px 0 0;padding:6px 8px;border-radius:6px;
  background:#FDF6E3;color:#6B5312;font-size:11.5px;line-height:1.4;
}
.pop a{display:inline-block;margin-top:8px;color:var(--ink)}

/* ---------- footer ---------- */
.foot{
  position:absolute;left:8px;bottom:calc(4px + env(safe-area-inset-bottom,0px));
  z-index:500;font-size:10.5px;color:var(--ink-soft);
  background:rgba(247,248,249,.85);padding:3px 7px;border-radius:5px;
  max-width:calc(100% - 120px);
}
.foot a{color:var(--ink-soft)}

/* ---------- boot overlay ---------- */
.boot{
  position:absolute;inset:0;z-index:700;
  display:flex;align-items:center;justify-content:center;
  background:var(--paper);
  font-size:14px;color:var(--ink-soft);
  transition:opacity .35s ease;
}
.boot[hidden]{display:none}
.boot.gone{opacity:0;pointer-events:none}
.boot .inner{text-align:center;max-width:280px;padding:0 20px}
.bar-track{
  width:180px;height:3px;border-radius:2px;background:var(--steel);
  margin:12px auto 0;overflow:hidden;
}
.bar-fill{height:100%;width:0;background:var(--ink);transition:width .25s ease}

/* ---------- small screens ---------- */
@media (max-width:640px){
  .brand span{display:none}
  button.solid{padding:0 11px;font-size:13.5px}
  button.ghost{padding:0 11px}
  button.ghost .label{display:none}
  .panel{
    top:auto;left:0;right:0;bottom:0;width:auto;
    max-height:min(76%,560px);
    border-radius:14px 14px 0 0;border-bottom:0;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .status{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>

<div id="map" role="application" aria-label="Map of plate reader cameras, armed conflict and natural disasters"></div>

<header class="bar">
  <div class="brand">
    <h1>Plate Reader Map</h1>
    <span>ALPR cameras · armed conflict · natural disasters</span>
  </div>

  <div class="searchrow">
    <div class="field">
      <input id="q" type="text" placeholder="City, ZIP, or address" autocomplete="off"
             aria-label="Search for a place" aria-autocomplete="list" aria-controls="hits">
      <button class="iconbtn" id="locate" title="Use my location" aria-label="Use my location">◎</button>
    </div>
    <button class="solid" id="go">Search</button>
    <button class="ghost" id="panel-toggle" aria-expanded="false" aria-controls="panel"
            title="Choose which data to show">
      <span class="label">Layers</span>
      <span class="count" id="panel-count">3</span>
    </button>
  </div>
</header>

<aside class="panel" id="panel" aria-label="Map layers" hidden>
  <div class="panel-head">
    <h2>Layers &amp; filters</h2>
    <button class="iconbtn" id="panel-close" aria-label="Close layers panel">✕</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</aside>

<div class="hits" id="hits" role="listbox" aria-label="Search results" hidden></div>
<div class="status" id="status" hidden></div>

<div class="foot">
  Cameras © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
  (ODbL) · conflict <a href="https://ucdp.uu.se/" target="_blank" rel="noopener">UCDP</a> (CC BY)
  · hazards <a href="https://earthquake.usgs.gov/" target="_blank" rel="noopener">USGS</a>,
  <a href="https://eonet.gsfc.nasa.gov/" target="_blank" rel="noopener">NASA</a>,
  <a href="https://www.gdacs.org/" target="_blank" rel="noopener">GDACS</a>
  · basemap <a href="https://openfreemap.org/" target="_blank" rel="noopener">OpenFreeMap</a>
  · <span id="stamp"></span>
</div>

<div class="boot" id="boot">
  <div class="inner">
    <div id="boot-msg">Loading map data…</div>
    <div class="bar-track"><div class="bar-fill" id="boot-bar"></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
